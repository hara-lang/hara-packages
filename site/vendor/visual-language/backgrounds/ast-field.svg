<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 2304" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">Hara syntax conduit field</title>
<desc id="desc">A precise abstract syntax tree is routed through a pointed gothic frame like machined signal conduits.</desc>
  <defs>
    <style>
      :root{--ground:#f6f8fa;--ground2:#ffffff;--plate:#e7ebef;--plate2:#cfd5db;--ink:#11151a;--line:#5e6873;--faint:#8b949e;--recess:#b8c0c8;--signal:#2f7cff;--signalSoft:#8db2ff}
      @media(prefers-color-scheme:dark){:root{--ground:#050608;--ground2:#080a0d;--plate:#11151a;--plate2:#20262d;--ink:#f4f6f8;--line:#9aa4af;--faint:#6f7882;--recess:#0b0e12;--signal:#4d8cff;--signalSoft:#8db2ff}}
    </style>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ground2)"/><stop offset=".55" stop-color="var(--ground)"/><stop offset="1" stop-color="var(--plate)"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--plate2)"/><stop offset=".34" stop-color="var(--ground2)"/><stop offset=".62" stop-color="var(--plate)"/><stop offset="1" stop-color="var(--plate2)"/></linearGradient>
    <pattern id="microgrid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".045"/><circle cx="0" cy="0" r="2.5" fill="var(--ink)" opacity=".07"/></pattern>
    <pattern id="brush" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 3H16M0 8H16M0 13H16" stroke="var(--ink)" stroke-width="1" opacity=".025"/></pattern>
    <filter id="signalGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="4096" height="2304" fill="url(#ground)"/>
  <rect width="4096" height="2304" fill="url(#microgrid)"/>
  <g transform="translate(2048 1260)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0 600V240C0 70-150-40-360-120L-980-370M0 240C0 70 150-40 360-120L980-370" stroke="var(--recess)" stroke-width="64"/>
    <path d="M-980-370L-1460-650M-980-370L-1460-210M980-370L1460-650M980-370L1460-210" stroke="var(--recess)" stroke-width="54"/>
    <path d="M-1460-650L-1730-820M-1460-650L-1740-520M-1460-210L-1770-300M-1460-210L-1750-40M1460-650L1730-820M1460-650L1740-520M1460-210L1770-300M1460-210L1750-40" stroke="var(--recess)" stroke-width="44"/>
    <path d="M0 600V240C0 70-150-40-360-120L-980-370M0 240C0 70 150-40 360-120L980-370" stroke="var(--ink)" stroke-width="8" opacity=".62"/>
    <path d="M-980-370L-1460-650M-980-370L-1460-210M980-370L1460-650M980-370L1460-210" stroke="var(--ink)" stroke-width="7" opacity=".55"/>
    <path d="M-1460-650L-1730-820M-1460-650L-1740-520M-1460-210L-1770-300M-1460-210L-1750-40M1460-650L1730-820M1460-650L1740-520M1460-210L1770-300M1460-210L1750-40" stroke="var(--ink)" stroke-width="6" opacity=".46"/>
  </g>
  <g fill="url(#metal)" stroke="var(--ink)" stroke-width="5" opacity=".96">
    <path d="M1940 1810L2048 1660l108 150-108 150Z"/>
    <path d="M1680 1120L1772 990l92 130-92 130Z"/><path d="M2232 1120L2324 990l92 130-92 130Z"/>
    <path d="M980 740L1060 626l80 114-80 114Z"/><path d="M1540 740L1620 626l80 114-80 114Z"/>
    <path d="M2396 740L2476 626l80 114-80 114Z"/><path d="M2956 740L3036 626l80 114-80 114Z"/>
  </g>
  <g fill="var(--signal)" filter="url(#signalGlow)"><circle cx="2048" cy="1810" r="15"/><circle cx="1772" cy="1120" r="12"/><circle cx="2324" cy="1120" r="12"/></g>
  <g fill="none" stroke="var(--ink)" opacity=".22">
    <path d="M620 1900C620 1040 1090 480 2048 210C3006 480 3476 1040 3476 1900" stroke-width="8"/>
    <path d="M820 1900C820 1130 1210 650 2048 390C2886 650 3276 1130 3276 1900" stroke-width="3"/>
    <path d="M128 128H3968V2176H128Z" stroke-width="4"/>
  </g>
  <rect width="4096" height="2304" fill="url(#brush)"/>
</svg>
