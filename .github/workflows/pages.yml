name: Deploy packages.hara-lang.org

on:
  push:
    branches: [main, production]
    paths: [site/**, packages/**, registry.edn, netlify/**, netlify.toml, test/**, package.json, .github/scripts/**, .github/workflows/pages.yml]
  pull_request:
    branches: [main, production]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-packages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, '[deploy]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test functions
        run: node --test "test/**/*.test.mjs"
      - name: Deploy main to packages.testing.hara-lang.org
        if: >-
          (github.event_name != 'pull_request' && github.ref_name == 'main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
        run: npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy production to packages.hara-lang.org
        if: >-
          (github.event_name != 'pull_request' && github.ref_name == 'production') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'production')
        run: npx --yes netlify-cli deploy --prod --dir site --message "production ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Reconcile packages.testing.hara-lang.org
        if: >-
          (github.event_name != 'pull_request' && github.ref_name == 'main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.testing.hara-lang.org
      - name: Reconcile packages.hara-lang.org
        if: >-
          (github.event_name != 'pull_request' && github.ref_name == 'production') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'production')
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.hara-lang.org
