name: Deploy packages.hara-lang.org

on:
  push:
    branches: [main, testing]
    paths: [site/**, packages/**, src/**, scripts/**, netlify/**, netlify.toml, test/**, package.json, .github/scripts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-packages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Preflight published package Showcases
        run: npm run showcase:preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build package Gallery index
        run: npm run gallery:build
      - name: Validate publication, Showcase and Gallery contracts
        run: npm run validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify built shared identity shell
        run: |
          grep -Fq 'data-hara-identity' site/index.html
          grep -Fq 'data-hara-identity-fallback' site/index.html
          grep -Fq '/v1/identity-client.js' site/index.html
          if grep -R -E 'HARA_GITHUB_OAUTH_CLIENT_SECRET|HARA_AUTH_SESSION_SECRET|/auth/github/callback' site; then
            echo 'The Packages artifact must not contain Identity secrets or a local OAuth callback.' >&2
            exit 1
          fi
      - name: Version deployed static assets
        run: npm run assets:version -- "$GITHUB_SHA"
      - name: Deploy testing to packages.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: |
          npx --yes netlify-cli build
          npx --yes netlify-cli deploy --prod --dir site --message "testing ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.HARA_PACKAGES_NETLIFY_TESTING_SITE_ID }}
      - name: Reconcile packages.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.HARA_PACKAGES_NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.testing.hara-lang.org
      - name: Verify testing static assets
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-static-assets.sh
        env:
          HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org
          HARA_ASSET_VERSION: ${{ github.sha }}
      - name: Verify testing shared identity
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org
      - name: Deploy main to packages.hara-lang.org
        if: github.ref_name == 'main'
        run: |
          npx --yes netlify-cli build
          npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.HARA_PACKAGES_NETLIFY_PRODUCTION_SITE_ID }}
      - name: Reconcile packages.hara-lang.org
        if: github.ref_name == 'main'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.HARA_PACKAGES_NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.hara-lang.org
      - name: Verify production static assets
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-static-assets.sh
        env:
          HARA_SITE_ORIGIN: https://packages.hara-lang.org
          HARA_ASSET_VERSION: ${{ github.sha }}
      - name: Verify production shared identity
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://packages.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
