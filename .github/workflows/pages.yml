name: Deploy packages.hara-lang.org

on:
  push:
    branches: [main, testing]
    paths: [site/**, packages/**, requests/**, registry.edn, src/**, scripts/**, netlify/**, netlify.toml, test/**, package.json, .github/scripts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: netlify-packages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build publication candidate projection
        run: npm run requests:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preflight published package Showcases
        run: npm run showcase:preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build package Gallery index
        run: npm run gallery:build
      - name: Validate publication, Showcase and Gallery contracts
        run: npm run validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install ORAS
        if: github.ref_name == 'main'
        uses: oras-project/setup-oras@v1
      - name: Publish registry artifact to GitHub Packages
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY}"
          echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$registry:sha-${GITHUB_SHA}" \
            --artifact-type application/vnd.hara.registry.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.description=Hara registry EDN" \
            registry.edn:application/vnd.hara.registry.v1+edn
          oras tag "$registry:sha-${GITHUB_SHA}" "${GITHUB_REF_NAME}"
      - name: Verify public GitHub Packages registry artifact
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY}"
          token_url="https://ghcr.io/token?service=ghcr.io&scope=repository%3A${GITHUB_REPOSITORY//\//%2F}%3Apull"
          manifest_path="$(mktemp)"
          headers_path="$(mktemp)"
          layer_path="$(mktemp)"
          trap 'rm -f "$manifest_path" "$headers_path" "$layer_path"' EXIT
          token="$(curl --fail-with-body --silent --show-error --location "$token_url" | jq -er '.token')"
          curl --retry 12 --retry-delay 5 --retry-all-errors --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            --dump-header "$headers_path" \
            "https://$registry/manifests/main" \
            --output "$manifest_path"
          test "$(jq -r '.annotations["org.opencontainers.image.source"]' "$manifest_path")" = "https://github.com/${GITHUB_REPOSITORY}"
          test "$(jq -r '.annotations["org.opencontainers.image.revision"]' "$manifest_path")" = "$GITHUB_SHA"
          layer_digest="$(jq -er '.layers[] | select(.mediaType == "application/vnd.hara.registry.v1+edn") | .digest' "$manifest_path")"
          layer_count="$(jq '[.layers[] | select(.mediaType == "application/vnd.hara.registry.v1+edn")] | length' "$manifest_path")"
          test "$layer_count" = 1
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $token" \
            "https://$registry/blobs/$layer_digest" \
            --output "$layer_path"
          test "sha256:$(shasum -a 256 "$layer_path" | cut -d ' ' -f 1)" = "$layer_digest"
          grep -Eiq '^docker-content-digest: sha256:[0-9a-f]{64}' "$headers_path"
      - name: Verify built shared identity shell
        run: |
          grep -Fq 'data-hara-identity' site/index.html
          grep -Fq 'data-hara-identity-fallback' site/index.html
          grep -Fq '/v1/identity-client.js' site/index.html
          if grep -R -E 'HARA_GITHUB_OAUTH_CLIENT_SECRET|HARA_AUTH_SESSION_SECRET|/auth/github/callback' site; then
            echo 'The Packages artifact must not contain Identity secrets or a local OAuth callback.' >&2
            exit 1
          fi
      - name: Version deployed static assets
        run: npm run assets:version -- "$GITHUB_SHA"
      - name: Deploy testing to packages.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: npx --yes netlify-cli deploy --prod --dir site --message "testing ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Reconcile packages.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.testing.hara-lang.org
      - name: Verify testing static assets
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-static-assets.sh
        env:
          HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org
          HARA_ASSET_VERSION: ${{ github.sha }}
      - name: Verify testing shared identity
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org
      - name: Deploy main to packages.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Reconcile packages.hara-lang.org
        if: github.ref_name == 'main'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: packages.hara-lang.org
      - name: Verify production static assets
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-static-assets.sh
        env:
          HARA_SITE_ORIGIN: https://packages.hara-lang.org
          HARA_ASSET_VERSION: ${{ github.sha }}
      - name: Verify production shared identity
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://packages.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
