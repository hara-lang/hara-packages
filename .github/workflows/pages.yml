name: Deploy packages.hara-lang.org

on:
  push:
    branches: [main, production]
    paths: [site/**, packages/**, registry.edn, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-packages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy main to packages.testing.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy production to packages.hara-lang.org
        if: github.ref_name == 'production'
        run: npx --yes netlify-cli deploy --prod --dir site --message "production ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
