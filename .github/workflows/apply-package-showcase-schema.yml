name: Apply package Showcase schema

on:
  push:
    branches: [agent/package-showcase-schema]
    paths: [.github/workflows/apply-package-showcase-schema.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/package-showcase-schema
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the complete Showcase schema tree
        env:
          SHOWCASE_SCHEMA_ARCHIVE: 
        run: |
          printf '%s' "$SHOWCASE_SCHEMA_ARCHIVE" | base64 --decode | tar -xz

      - name: Validate the complete schema and generated index
        run: npm run validate

      - name: Commit the schema tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json src scripts test/showcase.test.mjs site/gallery.json docs/showcase-format.md .github/workflows/validate.yml .github/workflows/pages.yml
          git diff --cached --check
          git commit -m "Define package Showcases and Gallery indexing"
          git push origin HEAD:agent/package-showcase-schema
