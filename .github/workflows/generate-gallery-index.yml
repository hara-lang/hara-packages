name: Generate Gallery index

on:
  push:
    branches:
      - agent/publish-alumbra-history-showcases

permissions:
  contents: write

concurrency:
  group: generate-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run gallery:build
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- site/gallery.json; then
            echo "Gallery index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gallery.json
          git commit -m "Regenerate Gallery index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
