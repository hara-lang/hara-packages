name: Apply Package Gallery UI from chunks

on:
  push:
    branches: [agent/package-gallery-ui]
    paths: [.github/workflows/apply-package-gallery-ui-chunks.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/package-gallery-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and install the Gallery product tree
        run: |
          cat .github/gallery-archive/chunk-* > /tmp/package-gallery-ui.b64
          printf '%s  %s\n' 'cd82b6577ee3423b280582a5368f9e3cf1757b8e487ee0fe3a2a8fe7d1474031' '/tmp/package-gallery-ui.b64' | sha256sum --check
          base64 --decode /tmp/package-gallery-ui.b64 > /tmp/package-gallery-ui.tar.gz
          printf '%s  %s\n' '51147dc5a588ca7230c61653675b61651ef1483f22e55255b6705595d3f2b0f9' '/tmp/package-gallery-ui.tar.gz' | sha256sum --check
          tar -xzf /tmp/package-gallery-ui.tar.gz

      - name: Validate the complete Gallery tree
        run: |
          node --check site/gallery.js
          node --check scripts/verify-gallery-browser.mjs
          npm test
          npm run gallery:check

      - name: Commit the Gallery product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/page.css site/gallery.js scripts/verify-gallery-browser.mjs test/gallery-ui.test.mjs
          git diff --cached --check
          git commit -m "Build the Storybook-style Package Gallery"
          git push origin HEAD:agent/package-gallery-ui
