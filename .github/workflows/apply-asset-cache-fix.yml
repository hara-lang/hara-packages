name: Apply Packages asset cache hotfix

on:
  push:
    branches:
      - agent/fix-packages-asset-cache
    paths:
      - ".github/workflows/apply-asset-cache-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-packages-asset-cache

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply cache-safe asset references and deployment checks
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          release = "20260809-1"

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected source text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replacements = {
              './vendor/visual-language/hara-logo.svg': f'/vendor/visual-language/hara-logo.svg?v={release}',
              './vendor/visual-language/theme.css': f'/vendor/visual-language/theme.css?v={release}',
              './page.css': f'/page.css?v={release}',
              './public-shell.css': f'/public-shell.css?v={release}',
              './visual-refresh.css': f'/visual-refresh.css?v={release}',
              './theme-toggle.js': f'/theme-toggle.js?v={release}',
              './gallery.js': f'/gallery.js?v={release}',
          }
          index = Path('site/index.html')
          index_text = index.read_text()
          for old, new in replacements.items():
              if old not in index_text:
                  raise SystemExit(f"expected asset reference not found: {old}")
              index_text = index_text.replace(old, new)
          index.write_text(index_text)

          replace_exact(
              'site/vendor/visual-language/theme.css',
              '@import "./tokens.css";',
              f'@import "./tokens.css?v={release}";',
          )
          replace_exact(
              'site/theme-toggle.js',
              'from "./vendor/visual-language/theme.js";',
              f'from "./vendor/visual-language/theme.js?v={release}";',
          )

          netlify = Path('netlify.toml')
          netlify_text = netlify.read_text().rstrip() + '\n\n'
          header_paths = [
              '/page.css',
              '/public-shell.css',
              '/visual-refresh.css',
              '/theme-toggle.js',
              '/gallery.js',
              '/gallery.json',
              '/index.json',
              '/vendor/visual-language/theme.css',
              '/vendor/visual-language/tokens.css',
              '/vendor/visual-language/theme.js',
          ]
          for asset_path in header_paths:
              netlify_text += f'''[[headers]]
            for = "{asset_path}"
            [headers.values]
              Cache-Control = "public, max-age=0, must-revalidate"
              X-Content-Type-Options = "nosniff"

          '''
          netlify.write_text(netlify_text)

          visual_test = Path('test/site-visual-language.test.mjs')
          test_text = visual_test.read_text()
          old = 'assert.match(theme, /@import "\\.\\/tokens\\.css"/);'
          new = 'assert.match(theme, /@import "\\.\\/tokens\\.css\\?v=20260809-1"/);'
          if old not in test_text:
              raise SystemExit('visual-language import assertion was not found')
          test_text = test_text.replace(old, new)
          visual_test.write_text(test_text)

          pages = Path('.github/workflows/pages.yml')
          pages_text = pages.read_text()
          testing_anchor = '''      - name: Verify testing shared identity
          if: >-
            (github.event_name != 'pull_request' && github.ref_name == 'main') ||
            (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
          run: bash .github/scripts/verify-shared-identity.sh
          env:
            HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org
            HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org
          '''
          testing_replacement = '''      - name: Verify testing static assets
          if: >-
            (github.event_name != 'pull_request' && github.ref_name == 'main') ||
            (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
          run: bash .github/scripts/verify-static-assets.sh
          env:
            HARA_SITE_ORIGIN: https://packages.testing.hara-lang.org

          ''' + testing_anchor
          if testing_anchor not in pages_text:
              raise SystemExit('testing verification anchor was not found')
          pages_text = pages_text.replace(testing_anchor, testing_replacement)

          production_anchor = '''      - name: Verify production shared identity
          if: >-
            (github.event_name != 'pull_request' && github.ref_name == 'production') ||
            (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'production')
          run: bash .github/scripts/verify-shared-identity.sh
          env:
            HARA_SITE_ORIGIN: https://packages.hara-lang.org
            HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
          '''
          production_replacement = '''      - name: Verify production static assets
          if: >-
            (github.event_name != 'pull_request' && github.ref_name == 'production') ||
            (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'production')
          run: bash .github/scripts/verify-static-assets.sh
          env:
            HARA_SITE_ORIGIN: https://packages.hara-lang.org

          ''' + production_anchor
          if production_anchor not in pages_text:
              raise SystemExit('production verification anchor was not found')
          pages.write_text(pages_text.replace(production_anchor, production_replacement))
          PY

          cat > .github/scripts/verify-static-assets.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${HARA_SITE_ORIGIN:?HARA_SITE_ORIGIN is required}"
          origin="${HARA_SITE_ORIGIN%/}"
          release="20260809-1"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          assets=(
            "/vendor/visual-language/theme.css?v=${release}|text/css"
            "/vendor/visual-language/tokens.css?v=${release}|text/css"
            "/page.css?v=${release}|text/css"
            "/public-shell.css?v=${release}|text/css"
            "/visual-refresh.css?v=${release}|text/css"
            "/theme-toggle.js?v=${release}|javascript"
            "/vendor/visual-language/theme.js?v=${release}|javascript"
            "/gallery.js?v=${release}|javascript"
            "/gallery.json|application/json"
          )

          for entry in "${assets[@]}"; do
            path="${entry%%|*}"
            expected="${entry#*|}"
            name="$(printf '%s' "$path" | tr '/?=&' '____')"
            headers="$work/${name}.headers"
            body="$work/${name}.body"
            status="$(curl --silent --show-error --location --compressed \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "${origin}${path}")"

            if [[ "$status" != "200" ]]; then
              echo "${path} returned HTTP ${status}." >&2
              exit 1
            fi

            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^content-type:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            case "$expected" in
              javascript)
                [[ "$content_type" =~ ^(application|text)/(javascript|x-javascript) ]] || {
                  echo "${path} returned ${content_type}, not JavaScript." >&2
                  exit 1
                }
                ;;
              *)
                [[ "$content_type" == "$expected"* ]] || {
                  echo "${path} returned ${content_type}, expected ${expected}." >&2
                  exit 1
                }
                ;;
            esac

            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^cache-control:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            if [[ "$cache_control" != *"max-age=0"* || "$cache_control" != *"must-revalidate"* ]]; then
              echo "${path} is still browser-cacheable without revalidation: ${cache_control}" >&2
              exit 1
            fi

            if [[ ! -s "$body" ]]; then
              echo "${path} returned an empty body." >&2
              exit 1
            fi
          done

          curl --fail --silent --show-error --location --compressed \
            "${origin}/" > "$work/index.html"
          for reference in \
            "/vendor/visual-language/theme.css?v=${release}" \
            "/page.css?v=${release}" \
            "/public-shell.css?v=${release}" \
            "/visual-refresh.css?v=${release}" \
            "/theme-toggle.js?v=${release}" \
            "/gallery.js?v=${release}"; do
            grep -Fq "$reference" "$work/index.html" || {
              echo "The live page does not reference ${reference}." >&2
              exit 1
            }
          done

          echo "Verified cache-safe Packages assets at ${origin}."
          SH
          chmod +x .github/scripts/verify-static-assets.sh

          cat > test/site-assets.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const read = (path) => readFile(new URL(path, import.meta.url), "utf8");
          const [page, theme, toggle, config, workflow, verifier] = await Promise.all([
            read("../site/index.html"),
            read("../site/vendor/visual-language/theme.css"),
            read("../site/theme-toggle.js"),
            read("../netlify.toml"),
            read("../.github/workflows/pages.yml"),
            read("../.github/scripts/verify-static-assets.sh"),
          ]);

          const release = "20260809-1";
          const mutableAssets = [
            "/vendor/visual-language/theme.css",
            "/page.css",
            "/public-shell.css",
            "/visual-refresh.css",
            "/theme-toggle.js",
            "/gallery.js",
          ];

          test("the public page cache-busts every mutable presentation asset", () => {
            for (const asset of mutableAssets) {
              assert.match(page, new RegExp(`${asset.replaceAll("/", "\\/")}\\?v=${release}`));
            }
            assert.match(theme, new RegExp(`tokens\\.css\\?v=${release}`));
            assert.match(toggle, new RegExp(`theme\\.js\\?v=${release}`));
          });

          test("Netlify requires mutable assets to revalidate", () => {
            for (const asset of [
              "/page.css",
              "/public-shell.css",
              "/visual-refresh.css",
              "/theme-toggle.js",
              "/gallery.js",
              "/gallery.json",
              "/index.json",
              "/vendor/visual-language/theme.css",
              "/vendor/visual-language/tokens.css",
              "/vendor/visual-language/theme.js",
            ]) {
              const escaped = asset.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              assert.match(
                config,
                new RegExp(`\\[\\[headers\\]\\][\\s\\S]*?for = "${escaped}"[\\s\\S]*?Cache-Control = "public, max-age=0, must-revalidate"`),
              );
            }
          });

          test("production deployment verifies live asset MIME, cache and document references", () => {
            assert.match(workflow, /Verify testing static assets/);
            assert.match(workflow, /Verify production static assets/);
            assert.match(workflow, /verify-static-assets\.sh/);
            assert.match(verifier, /content-type:/i);
            assert.match(verifier, /max-age=0/);
            assert.match(verifier, /must-revalidate/);
            assert.match(verifier, /Verified cache-safe Packages assets/);
          });
          JS

          rm .github/workflows/apply-asset-cache-fix.yml

      - name: Validate the hotfix
        run: npm run validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit the hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/scripts/verify-static-assets.sh \
            .github/workflows/pages.yml \
            netlify.toml \
            site/index.html \
            site/theme-toggle.js \
            site/vendor/visual-language/theme.css \
            test/site-assets.test.mjs \
            test/site-visual-language.test.mjs \
            .github/workflows/apply-asset-cache-fix.yml
          git commit -m "Prevent stale Packages presentation assets"
          git push origin HEAD:agent/fix-packages-asset-cache
