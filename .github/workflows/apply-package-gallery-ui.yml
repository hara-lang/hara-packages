name: Apply Package Gallery UI

on:
  push:
    branches: [agent/package-gallery-ui]
    paths: [.github/workflows/apply-package-gallery-ui.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/package-gallery-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Gallery product tree
        env:
          GALLERY_ARCHIVE: [... ELLIPSIZATION ...]
        run: |
          printf '%s' "$GALLERY_ARCHIVE" | base64 --decode | tar -xz

      - name: Validate the complete Gallery tree
        run: |
          node --check site/gallery.js
          node --check scripts/verify-gallery-browser.mjs
          npm test
          npm run gallery:check

      - name: Commit the Gallery product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/page.css site/gallery.js scripts/verify-gallery-browser.mjs test/gallery-ui.test.mjs
          git diff --cached --check
          git commit -m "Build the Storybook-style Package Gallery"
          git push origin HEAD:agent/package-gallery-ui
